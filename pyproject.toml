[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symptom-qnn"
version = "0.1.0"
description = "A transparent quantum-classifier study for symptom text"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11", "pandas>=2.1", "scikit-learn>=1.4",
  "qiskit>=1.2,<3", "qiskit-aer>=0.15,<1", "matplotlib>=3.8", "seaborn>=0.13"
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter>=1.0"]
demo = ["streamlit>=1.42"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
